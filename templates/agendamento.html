    <link rel="stylesheet" href="../static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <header>
        <link rel="stylesheet" href="../static/css/styleheader.css">
        <div class="container header-estetick">
            <div class="header-container">

                <!-- LOGO -->
                <a href="/index.html" class="logo-estetick">
                    <img src="/static/favicon_io/android-chrome-512x512.png" alt="Logo EstetickElite">

                    <span>
                        Estetick<span>Elite</span>
                    </span>
                </a>

                <!-- MENU -->
                <nav>
                    <ul class="nav-estetick">

                        <li>
                            <a href="/templates/index.html" class="active">
                                Home
                            </a>
                        </li>

                        <li>
                            <a href="/templates/cadastro.html">
                                Cadastro
                            </a>
                        </li>

                        <li>
                            <a href="/templates/agendamento.html">
                                Agendamento
                            </a>
                        </li>

                        <li>
                            <a href="/templates/faleconosco.html">
                                Fale conosco
                            </a>
                        </li>

                    </ul>
                </nav>

                <!-- BOTÕES -->
                <div class="botoes-header">

                    <a href="/templates/cadastro.html" class="btn-cadastrar">
                        Cadastrar
                    </a>

                    <a href="/templates/agendamento.html" class="btn-agendar">
                        Agendar
                    </a>

                </div>

            </div>
        </div>
    </header>
    <main class="container">

        <div class="agendamento">

            <div class="text-center mb-4">

                <h1>Agendamento</h1>

                <p style="color: #cccccc;">
                    Escolha o serviço, a data e o horário desejado.
                </p>

            </div>

            <form>

                <div class="mb-3">

                    <label class="form-label">
                        Nome completo
                    </label>

                    <input type="text" class="form-control" placeholder="Digite seu nome" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Veículo
                    </label>

                    <input type="text" class="form-control" placeholder="Ex.: Honda Civic" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Serviço
                    </label>

                    <select class="form-select" required>

                        <option value="">
                            Selecione um serviço
                        </option>

                        <option>
                            Lavagem técnica — R$ 80,00
                        </option>

                        <option>
                            Enceramento Wax — R$ 250,00
                        </option>

                        <option>
                            Revitalização de plásticos — R$ 480,00
                        </option>

                        <option>
                            Polimento de Pintura — R$ 700,00
                        </option>

                        <option>
                            Revitalização de Plásticos Internos — R$ 380,00
                        </option>

                        <option>
                            Vitrificação de Vidros — R$ 600,00
                        </option>

                        <option>
                            Descontaminação de Pintura — R$ 580,00
                        </option>

                        <option>
                            Polimento de Faróis — R$ 150,00
                        </option>

                        <option>
                            Combo Start — R$ 300,00
                        </option>

                        <option>
                            Combo Premium — R$ 750,00
                        </option>

                        <option>
                            Combo Elite — R$ 1.300,00
                        </option>

                    </select>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Data
                        </label>

                        <input type="date" class="form-control" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Horário
                        </label>

                        <input type="time" class="form-control" required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Observações
                    </label>

                    <textarea class="form-control" rows="4" placeholder="Alguma observação sobre o veículo?"></textarea>

                </div>

                <button type="submit" class="btn btn-estetick w-100">
                    Confirmar agendamento
                </button>

            </form>

        </div>

    </main>




    <div>
        <div id="footer-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="/js/script.js"></script>

</body>
